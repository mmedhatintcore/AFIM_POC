services:
  app:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    restart: unless-stopped
    working_dir: /var/www
    environment:
      APP_NAME: "${APP_NAME}"
      APP_ENV: "${APP_ENV}"
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "${APP_DEBUG}"
      APP_URL: "${APP_URL:-$SERVICE_FQDN_WEBSERVER}"
      APP_TIMEZONE: "${APP_TIMEZONE}"
      APP_LOCALE: "${APP_LOCALE}"
      APP_FALLBACK_LOCALE: "${APP_FALLBACK_LOCALE}"
      APP_FAKER_LOCALE: "${APP_FAKER_LOCALE}"
      APP_MAINTENANCE_DRIVER: "${APP_MAINTENANCE_DRIVER}"
      BCRYPT_ROUNDS: "${BCRYPT_ROUNDS}"
      LOG_CHANNEL: "${LOG_CHANNEL}"
      LOG_STACK: "${LOG_STACK}"
      LOG_DEPRECATIONS_CHANNEL: "${LOG_DEPRECATIONS_CHANNEL}"
      LOG_LEVEL: "${LOG_LEVEL}"
      DB_CONNECTION: "${DB_CONNECTION}"
      DB_HOST: "${DB_HOST}"
      DB_PORT: "${DB_PORT}"
      DB_DATABASE: "${DB_DATABASE}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"
      SESSION_DRIVER: "${SESSION_DRIVER}"
      SESSION_LIFETIME: "${SESSION_LIFETIME}"
      SESSION_ENCRYPT: "${SESSION_ENCRYPT}"
      SESSION_PATH: "${SESSION_PATH}"
      SESSION_DOMAIN: "${SESSION_DOMAIN}"
      BROADCAST_CONNECTION: "${BROADCAST_CONNECTION}"
      FILESYSTEM_DISK: "${FILESYSTEM_DISK}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION}"
      CACHE_STORE: "${CACHE_STORE}"
      CACHE_PREFIX: "${CACHE_PREFIX}"
      MEMCACHED_HOST: "${MEMCACHED_HOST}"
      REDIS_CLIENT: "${REDIS_CLIENT}"
      REDIS_HOST: "${REDIS_HOST}"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      REDIS_PORT: "${REDIS_PORT}"
      MAIL_MAILER: "${MAIL_MAILER}"
      MAIL_SCHEME: "${MAIL_SCHEME}"
      MAIL_HOST: "${MAIL_HOST}"
      MAIL_PORT: "${MAIL_PORT}"
      MAIL_USERNAME: "${MAIL_USERNAME}"
      MAIL_PASSWORD: "${MAIL_PASSWORD}"
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS}"
      MAIL_FROM_NAME: "${MAIL_FROM_NAME}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION}"
      AWS_BUCKET: "${AWS_BUCKET}"
      AWS_USE_PATH_STYLE_ENDPOINT: "${AWS_USE_PATH_STYLE_ENDPOINT}"
      VITE_APP_NAME: "${VITE_APP_NAME}"
      RUN_SEEDERS: "${RUN_SEEDERS:-false}"
    volumes:
      - app-storage:/var/www/storage
      - public-uploads:/var/www/public/uploads
      - public-build:/var/www/public/build
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9000 || exit 1"]
      interval: 10s
      retries: 5
      start_period: 90s

  webserver:
    build:
      context: .
      dockerfile: ./docker/nginx/Dockerfile
    restart: unless-stopped
    volumes:
      - app-storage:/var/www/storage
      - public-uploads:/var/www/public/uploads
      - public-build:/var/www/public/build
    depends_on:
      app:
        condition: service_healthy
    expose:
      - "80"

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: "${DB_DATABASE}"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      retries: 10
      start_period: 60s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 256M
      MAX_EXECUTION_TIME: 600
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "80"

volumes:
  mysql-data:
    name: afim-mysql-data
  app-storage:
    name: afim-app-storage
  redis-data:
    name: afim-redis-data
  public-uploads:
    name: afim-public-uploads
  public-build:
    name: afim-public-build
